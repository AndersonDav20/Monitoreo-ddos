# Configuración para cargar dashboards automáticamente
apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'Deteccion de Ataques'
    folderUid: 'deteccion-ataques'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
